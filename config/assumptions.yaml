coastal:
  # Step 3 (pipeline/03_hazards.py), coastal still-water model (decisions 2026-10-06).
  # Station assignment: shortest water path on an open-sea mask built from the LandsD 5 m DTM
  # (sea = 0), aggregated to this cell size; a 25 m cell is sea when most of its 5 m cells are 0.
  sea_mask_cell_m: 25          # source: user decision 2026-10-06
  sea_mask_majority: 0.5       # ASSUMPTION (share of 5 m sea cells for a 25 m sea cell)
  # Morphological closing of the 25 m mask (3 x 3, this many times, ~50 m): the DTM records
  # bridge decks across channels (Tsing Ma, Kap Shui Mun, Ting Kau, Stonecutters, Shing Mun
  # River), which otherwise cut Rambler Channel, Tsuen Wan bay, Shing Mun River and Kai Tak off
  # the open sea (checked 2026-10-06: 1 iteration leaves Rambler Channel cut). Inland water
  # (inland_water_points_e_n) is removed first so the closing cannot join it across a dam.
  sea_mask_close_iterations: 2  # ASSUMPTION
  # Ambiguous: runner-up station's water path <= ratio x the winner's, or the straight-line
  # nearest station differs from the water-path winner
  station_ambiguity_ratio: 1.5         # ASSUMPTION (user decision 2026-10-06)
  # Material: the ambiguous candidates' baseline extreme sea levels at this RP differ by more than
  station_material_diff_m: 0.10        # ASSUMPTION (user decision 2026-10-06)
  station_material_rp: 100             # source: plan 2026-10-06 (1-in-100 compared)
  # Station rule (user decision 2026-10-07, replaces case-by-case review): Tai Po Kau is
  # eligible only for assets draining to Tolo Harbour (Sha Tin, Ma On Shan, Tai Po). Reason:
  # Tolo Harbour is a semi-enclosed basin with local surge amplification, so its levels do not
  # apply outside it. "Draining to Tolo Harbour" = ALS district of the accepted point in this
  # list (Ma On Shan is in Sha Tin District); a blank district is not eligible. For every other
  # asset Tai Po Kau is dropped from winner, runner-up and straight-line candidates.
  # Remaining material ambiguous assets keep the water-path station as central; the highest
  # candidate gives station_alt and level_station_high_mpd (coastal_levels.csv, not a scenario).
  tolo_harbour_station: tai_po_kau     # ASSUMPTION (user decision 2026-10-07; reason above)
  tolo_harbour_districts: ["SHA TIN DISTRICT", "TAI PO DISTRICT"]  # ASSUMPTION (user decision 2026-10-07: Sha Tin, Ma On Shan, Tai Po)
  # Connectivity on the 5 m DTM (whole metres): pass h floods cells with DTM <= h that are
  # 4-connected to the sea. Level W uses pass floor(W); connected only at floor(W) + 1 = uncertain.
  connectivity_passes_m: [3, 4, 5, 6, 7, 8]  # source: user decision 2026-10-06
  connectivity_proximity_m: 50               # ASSUMPTION (user decision 2026-10-06): sea-connected wet cells within this distance of the footprint / approx circle
  # Sea seeds = DTM zero-valued components (4-connected, 5 m) of at least this area, which
  # keeps tidal channels cut off by bridges in the DTM (Rambler Channel, Shing Mun River, ...)
  connectivity_sea_min_area_ha: 1.0          # ASSUMPTION
  # Zero-valued DTM components that are inland water, not sea: any component containing one
  # of these points (EPSG:2326) is dropped from the seeds
  # LiDAR along the route to the sea (user decision 2026-10-07): for these assets the
  # connectivity class comes from the CEDD 2020 LiDAR DTM (0.5 m) instead of the 5 m passes.
  # Route = shortest path through the sea-connected wet cells of the lowest 5 m DTM pass that
  # reaches the asset (within lidar_route_window_m of it, up to lidar_route_max_pass_m); LiDAR
  # tiles = those intersecting the route + asset buffered by lidar_corridor_m. Sill = lowest
  # still-water level at which sea-connected LiDAR cells lie within lidar_proximity_m of the
  # footprint / approx circle (bisection to lidar_sill_tolerance_m). LiDAR no-data cells are
  # filled from the 5 m DTM. Bare-earth DTM: walls, parapets and flood gates are not resolved.
  lidar_refine_valuation_nos: [126, 128, 92, 50, 94, 41, 35, 49, 96]  # source: user decision 2026-10-07 (7 'uncertain' + 3 'isolated_low'); no. 56 left out until its accepted point is fixed (geocoded to Lo Lung Hang Street, Hung Hom)
  # ...plus every asset whose entry level is below this (onset >= entry, so the onset table for
  # onset < 6 mPD is complete and LiDAR-based)
  lidar_refine_below_entry_mpd: 6.0  # source: user decision 2026-10-07 (return-period table for onset < 6 mPD)
  lidar_route_window_m: 5000     # ASSUMPTION (5 m DTM search window around the asset)
  lidar_route_max_pass_m: 15     # ASSUMPTION (above any modelled 2050 level)
  lidar_corridor_m: 100          # ASSUMPTION (half-width of the LiDAR corridor along the route)
  lidar_proximity_m: 10          # ASSUMPTION (= elevation.ring_width_m, the ring that sets entry_level_mpd)
  lidar_sill_tolerance_m: 0.01   # ASSUMPTION (bisection precision)
  # Onset level = lowest still-water level that floods the asset: max(entry level, LiDAR sill)
  # for LiDAR-refined assets, max(entry level, first 5 m pass that reaches it) otherwise.
  # Sensitivity: LiDAR-based onsets shifted by +/- this (systematic vertical error of the 2020
  # LiDAR DTM). The CSDI metadata (data/raw/lidar_dtm_2020/lidar_dtm2020_metadata_csdi.xml,
  # fetched 2026-10-07) states no vertical accuracy, only "The definition of the ground under
  # trees may be less accurate".
  lidar_vertical_accuracy_m: 0.15  # ASSUMPTION (no published figure found; user to confirm)
  # Approx-footprint check (step 4; planned Week 3 item, decision 2026-10-06/07): approximate-circle
  # assets whose onset is within within_m of this level are listed for possible hand footprints.
  approx_footprint_check:
    scenario: ssp245_2050  # source: user decision 2026-10-07
    return_period: 200     # source: user decision 2026-10-07
    slr_quantile: median   # ASSUMPTION (central SLR)
    within_m: 1.0          # source: decision 2026-10-06 ("within 1 m of a modelled flood level")
  inland_water_points_e_n:
    - [844637, 837369]  # ASSUMPTION: 1,092 ha zero-valued DTM component with dam-height ground around it (ring median 8 m) = Plover Cove Reservoir (centroid computed 2026-10-06)

rain:
  # Rain flooding indicators (option b, decisions 2026-10-06 / 2026-10-07); step 3
  # (pipeline/hazard_rain.py). No new LiDAR. DSD points (data/manual_local/dsd_flood_prone_areas.csv)
  # stay internal; only rain_score / rain_class are publishable.
  # score = DSD proximity points (nearest point of any group: <= dsd_near_m -> 2, <= dsd_mid_m -> 1)
  #       + 1 if local low spot (ring_median_mpd - entry_level_mpd >= low_spot_m)
  #       + 1 if basement car park (step 2 car_park_type 'basement')
  # class: 0 low, 1-2 medium, >= 3 high. Scenario index = score x (1 + HKO Rx1day % change / 100).
  dsd_near_m: 100      # ASSUMPTION
  dsd_mid_m: 250       # ASSUMPTION
  low_spot_m: 0.5      # ASSUMPTION (entry level at least this far below the ring median)
  class_medium_min: 1  # ASSUMPTION
  class_high_min: 3    # ASSUMPTION
  # Continuous score for ranking (decision 2026-10-07; classes stay for display):
  #   2 x max(0, 1 - dsd_nearest_m / cont_dsd_decay_m) + min(1, low_spot_m / cont_low_spot_full_m) + basement
  cont_dsd_decay_m: 500        # ASSUMPTION (proximity weight falls to 0 at this distance)
  cont_low_spot_full_m: 2.0    # ASSUMPTION (low-spot weight saturates at this depth)

landslide:
  # Landslide indicators (decision 2026-10-06 plan; step 3, pipeline/hazard_landslide.py): our own
  # derived metric, never presented as GEO data. Slope from the LandsD 5 m DTM (Horn 3 x 3, whole
  # metres: coarse); HLC = GEO Historical Landslide Catchments points (HLC_1924-2019.gdb, layer
  # HLC), counted unchanged within hlc_radius_m of the footprint / approx circle / point.
  # score = slope points (p90 slope within slope_buffer_m: >= steep -> 2, >= moderate -> 1)
  #       + HLC points (count >= hlc_many -> 2, >= 1 -> 1); class 0-1 low, 2 medium, 3-4 high.
  slope_buffer_m: 50        # ASSUMPTION
  slope_moderate_deg: 15    # ASSUMPTION
  slope_steep_deg: 30       # ASSUMPTION
  hlc_radius_m: 200         # ASSUMPTION
  hlc_many: 3               # ASSUMPTION
  class_medium_min: 2       # ASSUMPTION
  class_high_min: 3         # ASSUMPTION

coastal_sensitivity:
  # Future option, sensitivity HIGH case only (decision 2026-09-24): replace the PWDM
  # 2022 Tables 4 and 5 levels at Quarry Bay/North Point and Tai Po Kau with the
  # Appendix D tables that include pre-1954 storm records (1874-2019). Not used yet.
  pre1954_extreme_sea_levels_mpd:
    quarry_bay_north_point: null  # source: PWDM Corrigendum 1/2022 Appendix D, Table D1, p. 31
    tai_po_kau: null              # source: PWDM Corrigendum 1/2022 Appendix D, Table D2, p. 31

event_check:
  # Hato (2017) / Mangkhut (2018) sanity check (decision 2026-10-07): HKO maximum sea level,
  # m above Chart Datum, at the PWDM stations of this model; converted to mPD with
  # pipeline/datum.py. Values in config/local/assumptions.yaml (third-party transcription);
  # check sheet docs/internal/transcription_check.md. Stations without a reading (tai_o,
  # chi_ma_wan, ko_lau_wan) are "no observation", never filled from another station. Shek Pik
  # and Tai Miu Wan have readings but are not stations of this model (not transcribed).
  max_sea_level_mcd:
    hato_2017:
      quarry_bay_north_point: null  # source: HKO Tropical Cyclones in 2017, Table 3.3.4 (data/raw/hko_tc/hko_tc2017_table334_hato_sea_level.html), row "Quarry Bay", Maximum sea level Height (m)
      tai_po_kau: null              # source: as above, row "Tai Po Kau"
      tsim_bei_tsui: null           # source: as above, row "Tsim Bei Tsui"
      waglan_island: null           # source: as above, row "Waglan Island*" (* incomplete data)
    mangkhut_2018:
      quarry_bay_north_point: null  # source: HKO Tropical Cyclones in 2018, Table 3.5.5 (data/raw/hko_tc/hko_tc2018_table355_mangkhut_sea_level.html), row "Quarry Bay"
      tai_po_kau: null              # source: as above, row "Tai Po Kau"
      tsim_bei_tsui: null           # source: as above, row "Tsim Bei Tsui"
      waglan_island: null           # source: as above, table note ("severely damaged by Mangkhut ... recorded before damage"); not a table row
  # readings HKO marks as incomplete: the true maximum may have been higher (lower bound only)
  incomplete:
    hato_2017: [waglan_island]      # source: Table 3.3.4, "* incomplete data"
    mangkhut_2018: [waglan_island]  # source: Table 3.5.5 note (station damaged)

flood_extents:
  # "Raise the sea" slider (design brief docs/DESIGN_BRIEF.md, 2026-10-08): bathtub extents on the
  # LandsD 5 m DTM (pipeline/hazard_extents.py, step 3 layer 'extents' -> 07_export flood_extents.geojson).
  # Land cells with DTM <= pass that are 4-connected to the coastal sea seeds (coastal.connectivity_*).
  # Whole metres because the DTM is whole metres (+/- 5 m); illustration only, never used for asset results.
  passes_m: [3, 4, 5, 6, 7]   # ASSUMPTION (proposal 2026-10-08, for Jeff's approval): spans the modelled still-water levels, all stations and scenarios (2.8-6.7 mPD)
  min_area_m2: 10000           # ASSUMPTION: parts and holes smaller than 1 ha (400 DTM cells) dropped (file size: 2.3 MB vs 4.6 MB)
  simplify_m: 20               # ASSUMPTION: Douglas-Peucker tolerance (4 DTM cells; display only)

terrain_tiles:
  # Published terrain tiles for the site's 3D maps (decision 2026-10-08): pipeline/terrain_tiles.py, written by
  # 07_export.py to site/public/data/terrain/{z}/{x}/{y}.png (terrarium encoding) from the LandsD 5 m DTM.
  zooms: [5, 13]   # source: design brief / mockup 2026-10-08 (z5 needed by pitched views at the horizon; 256 tiles, ~12 MB)
  attribution: "Terrain derived from the LandsD 5 m Digital Terrain Model, HKSAR Government, via the CSDI Portal"  # source: user decision 2026-10-08

site_export:
  # Margin facts for named assets (decision 2026-10-08, The Quayside sentence): onset (LiDAR sill / entry) minus the
  # still-water level, in whole cm, plus whether a rarer return period already reaches the site. Only cm margins and
  # labels are exported (margins.json), never the mPD levels (export contract).
  margin_assets: [126]   # source: user decision 2026-10-08
  margin_cases:          # source: user decision 2026-10-08 (wording of the approved sentence)
    - {scenario: ssp245_2050, slr_quantile: median, return_period: 100}
    - {scenario: ssp245_2050, slr_quantile: high, return_period: 100}
    - {scenario: ssp585_2050, slr_quantile: high, return_period: 100}
  reach_cases:
    - {scenario: ssp245_2050, slr_quantile: median, return_period: 200}
  # Observed-event offsets for named assets (decision 2026-10-08, story step 2): event still-water level minus the
  # entry level and lowest floor minus the event level, whole cm; the cited HKO peak (m above Chart Datum) goes with it.
  event_assets:
    - {valuation_no: 129, event: mangkhut_2018, station: quarry_bay_north_point, gauge_name: "Quarry Bay", source: "Hong Kong Observatory, Tropical Cyclones in 2018, Table 3.5.5"}  # source: user decision 2026-10-08
