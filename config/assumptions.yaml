  # PWDM Part 1 Figure 2 "Locations of Tide Stations" (data/raw/pwdm_part1_current.pdf, PDF p. 152),
  # coordinate table, [degrees, minutes, seconds] N / E. Lok On Pai dropped (no extreme sea
