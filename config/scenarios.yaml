# Climate scenarios. All values are placeholders until sourced.
# Every value needs a `# source:` comment; unsourced values are marked `# ASSUMPTION`.
# Values transcribed from third-party documents (PWDM Table 44, HKO projections) are
# NOT stored here: keep the key with `null` and its `# source:` + page ref, and put the
# value in config/local/scenarios.yaml (gitignored). pipeline/config.py overlays it.

# sea_level_rise_m low/high = HKO "likely range": "The probability for the likely range to
# cover the outcome is at least 66%" (hko_msl_projection.html). Describe it that way on the
# site, not as a percentile range.

baseline:            # 1995-2014 climate (label "1995–2014 climate" on the site, never "today")
  period: [1995, 2014]
  # Zero by construction: HKO projections and PWDM 2022 extreme sea levels are both relative
  # to the 1995-2014 average / AR6 base year (hko_msl_projection.html; PWDM Corr. 1/2022 Tables 3-9A notes)
  sea_level_rise_m:
    median: 0.0  # source: baseline period = HKO/AR6 base period 1995-2014 (definition, not a projection)
    low: 0.0     # source: as median
    high: 0.0    # source: as median
  # Rain / heat (decision 2026-10-07): changes are 0 by construction (HKO projections are relative
  # to 1995-2014); the 1995-2014 averages HKO states on each page are transcribed (config/local).
  rx1day_change_pct: 0.0           # source: baseline period = HKO base period 1995-2014 (definition)
  mean_temp_change_c: 0.0          # source: as rx1day_change_pct
  rx1day_mm: null                  # source: HKO annual maximum daily rainfall (Rx1day) projection data (data/raw/hko_rainfall_projection.html): "Average annual maximum daily rainfall at the Hong Kong Observatory during 1995-2014"
  mean_temp_c: null                # source: HKO annual mean temperature projection data (data/raw/hko_temp_projection.html): "Average annual mean temperature at the Hong Kong Observatory during 1995-2014"
  very_hot_days:
    mean: null                     # source: HKO projection data of very hot days (data/raw/hko_hot_days_projection.html): "Average annual number of very hot days in Hong Kong during 1995-2014"
    low: null                      # source: no likely range for the observed baseline (stays null)
    high: null                     # source: as low
  hot_nights:
    mean: null                     # source: HKO projection data of hot nights (data/raw/hko_hot_nights_projection.html): "Average annual number of hot nights in Hong Kong during 1995-2014"
    low: null                      # source: no likely range for the observed baseline (stays null)
    high: null                     # source: as low
  storm_surge_increase_m: 0.0  # source: decision 2026-09-24 (baseline = present-day PWDM levels, no surge increase)

ssp245_2050:         # central case
  year: 2050
